      description: 'A worst-performing product plus why it was flagged. ``no_sales`` means it

        had stock but sold nothing; ``low_ctr`` means its CTR is in the bottom

        quartile of the collection; ``low_revenue`` is the fallback for otherwise

        weak revenue.'
