      - label
      title: AnalyticsPositionBand
      description: 'Aggregate click-through performance for a contiguous band of positions in

        the collection''s sort order (pinned first, then auto).


        Bands are fixed by 1-based position: ``hero`` = positions 1-3, ``mid`` = 4-8,

        ``tail`` = 9-12, ``bottom`` = 13+. ``avg_ctr`` is a percentage (0-100),

        ``clicks / views * 100`` aggregated over the in-band products that have

        metrics. ``clicks`` is the total clicks in the band. ``product_count`` is the

        number of products present in the ordered scope within the band (regardless

        of whether they have metrics). All four bands are always returned, even when

        empty.'
