          anyOf:
          - type: string
          - type: 'null'
          title: Query
        order_by:
          allOf:
          - $ref: '#/components/schemas/CollectionDataOrderBy'
          default: top_views
        from_date:
          type: string
          format: date
          title: From Date
        to_date:
          type: string
          format: date
          title: To Date
        reverse:
          type: boolean
          title: Reverse
          default: false
        filter_by:
          anyOf:
          - $ref: '#/components/schemas/CollectionFilterBy'
          - type: 'null'
      type: object
      required:
      - from_date
      - to_date
      title: GetDataSortedPaginatedCollectionsRequest
    CollectionDetail:
