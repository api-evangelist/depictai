    AnalyticsPinnedVsAutoItem:
      properties:
        main_product_id:
          type: string
          title: Main Product Id
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        pinned_ctr:
          type: number
          title: Pinned Ctr
          default: 0
        auto_ctr:
          type: number
          title: Auto Ctr
          default: 0
        delta_pts:
          type: number
          title: Delta Pts
          default: 0
        verdict:
          type: string
          enum:
          - better_auto
          - better_pinned
          - no_data
          title: Verdict
      type: object
      required:
      - main_product_id
      - verdict
      title: AnalyticsPinnedVsAutoItem
      description: 'Per-pinned-product comparison against the collection''s auto-cohort CTR.


        ``pinned_ctr`` is the product''s own CTR; ``auto_ctr`` is the aggregate CTR of

        all non-pinned products (a documented approximation of the counterfactual

        "if this had been auto-sorted"). ``delta_pts`` is ``auto_ctr - pinned_ctr``.

        ``verdict`` is ``better_auto`` when auto beats pinned by >0.5pts,

        ``better_pinned`` when pinned beats auto by >0.5pts, else ``no_data`` (neutral

        band or the product got no views). CTRs are percentages (0-100).'
