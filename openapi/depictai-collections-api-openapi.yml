components:
  schemas:
    VideoContent:
      properties:
        type:
          type: string
          enum:
          - video
          const: video
          title: Type
          default: video
        url:
          type: string
          title: Url
        link:
          anyOf:
          - type: string
          - type: 'null'
          title: Link
      type: object
      required:
      - url
      - link
      title: VideoContent
    CollectionProductMode:
      type: string
      enum:
      - auto
      - search
      - preview
      title: CollectionProductMode
    AnalyticsInventoryBreakdown:
      properties:
        hidden:
          type: integer
          title: Hidden
          default: 0
        low_stock:
          type: integer
          title: Low Stock
          default: 0
        ok:
          type: integer
          title: Ok
          default: 0
        at_risk:
          type: integer
          title: At Risk
          default: 0
        total:
          type: integer
          title: Total
          default: 0
        avg_stock_coverage_days:
          anyOf:
          - type: number
          - type: 'null'
          title: Avg Stock Coverage Days
        variants_in_stock:
          type: integer
          title: Variants In Stock
          default: 0
        variants_total:
          type: integer
          title: Variants Total
          default: 0
        variant_availability_pct:
          anyOf:
          - type: number
          - type: 'null'
          title: Variant Availability Pct
      type: object
      title: AnalyticsInventoryBreakdown
      description: 'Inventory health for the in-scope products.


        ``hidden`` is the count of manually-hidden products. ``low_stock`` counts

        visible products with ``0 < inventory <= LOW_STOCK_UNITS``; ``ok`` counts

        visible products with ``inventory > LOW_STOCK_UNITS``. Fully out-of-stock

        visible products (``inventory == 0``) are counted in ``total`` but not in

        ``ok``/``low_stock``. ``total`` is the number of in-scope products

        (visible + hidden). ``at_risk`` is ``hidden + low_stock``.

        ``avg_stock_coverage_days`` is ``total_inventory / (units_sold / period_days)``

        and ``None`` when nothing sold in the period.


        ``variant_availability_pct`` (0-100) is in-stock variants ÷ total variants

        across the in-scope products'' size/colour variants (``variants_in_stock`` /

        ``variants_total`` are the raw sums). ``None`` when the merchant has no

        variant-level inventory data.'
    GetDataSortedPaginatedCollectionsRequest:
      properties:
        offset:
          type: integer
          title: Offset
          default: 0
        page_size:
          type: integer
          title: Page Size
