aid: depictai
name: Depict.AI
description: >-
  Depict (Depict.AI) is an AI-powered merchandising, search and product-recommendations
  platform for e-commerce brands. It serves ranked collection and product-listing pages,
  hybrid AI site search, and personalized recommendations ("Similar Products", "You may
  also like", "Frequently bought together") through a front-end-agnostic Storefront API,
  React and JavaScript UI libraries, and a native Shopify app. Merchants curate hundreds
  of collections at scale with pinning, boost-and-bury rules and per-market settings while
  keeping full control of the storefront frontend. Depict is used by 350+ brands and is
  backed by EQT Ventures and Initialized Capital.
